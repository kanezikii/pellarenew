name: 🎮 Pella 自动续期
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # 用于清理工作流历史记录

jobs:
  renew:
    name: 🔄 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 安装依赖
        run: npm install

      - name: 🌐 安装 Playwright 浏览器
        run: npx playwright install chromium --with-deps

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb x11-utils xdotool

      - name: 🛡️ 启动 GOST 代理转发
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          echo "✅ GOST 已启动，测试连通性..."
          curl -s -x http://127.0.0.1:8080 https://api.ipify.org

            - name: 📥 下载 Xray
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray
          chmod +x xray/xray

      - name: 📝 生成 Xray 配置
        env:
          VMESS_LINK: ${{ secrets.VMESS_LINK }}
        run: |
          # 解码 VMess
          B64=$(echo "$VMESS_LINK" | sed 's/vmess:\/\///')
          echo "$B64" | base64 -d > vmess.json
          
          # 读取字段
          ADD=$(jq -r '.add' vmess.json)
          PORT=$(jq -r '.port' vmess.json)
          UUID=$(jq -r '.id' vmess.json)
          HOST=$(jq -r '.host' vmess.json)
          PATH=$(jq -r '.path' vmess.json)
          SNI=$(jq -r '.sni' vmess.json)
          FP=$(jq -r '.fp // "chrome"' vmess.json)
          
          cat > xray/config.json << EOF
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "port": 10808,
                "listen": "127.0.0.1",
                "protocol": "socks",
                "settings": { "udp": true }
              }
            ],
            "outbounds": [
              {
                "protocol": "vmess",
                "settings": {
                  "vnext": [
                    {
                      "address": "$ADD",
                      "port": $PORT,
                      "users": [
                        {
                          "id": "$UUID",
                          "alterId": 0,
                          "security": "auto"
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "tls",
                  "tlsSettings": {
                    "serverName": "$SNI",
                    "fingerprint": "$FP",
                    "allowInsecure": false
                  },
                  "wsSettings": {
                    "path": "$PATH",
                    "headers": {
                      "Host": "$HOST"
                    }
                  }
                }
              }
            ]
          }
          EOF
          echo "✅ Xray 配置已生成"

      - name: 🚀 启动 Xray 代理
        run: |
          nohup ./xray/xray -config xray/config.json > xray.log 2>&1 &
          sleep 3
          # 测试代理是否通
          curl -s --socks5 127.0.0.1:10808 https://api.ipify.org || echo "代理测试失败，继续尝试"
          echo "✅ Xray 已启动 (socks5://127.0.0.1:10808)"

      - name: 🚀 运行续期脚本
        env:
          PELLA_ACCOUNTS: ${{ secrets.PELLA_ACCOUNTS }}
          TG_BOT: ${{ secrets.TG_BOT }}
          PROXY_URL: socks5://127.0.0.1:10808
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npx playwright test tests/pella_renew.spec.js

      - name: 🔄 自动覆盖更新 Secrets (PELLA_ACCOUNTS)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # 👈 已经直接调用你现有的 GH_PAT
        run: |
          if [ -f "updated_accounts.txt" ]; then
            NEW_ACCOUNTS=$(cat updated_accounts.txt)
            if [ -n "$NEW_ACCOUNTS" ]; then
              echo "🔄 检测到 Cookie 已刷新，正在覆写 GitHub Secrets (PELLA_ACCOUNTS)..."
              gh secret set PELLA_ACCOUNTS -b "$NEW_ACCOUNTS" --repo ${{ github.repository }}
              echo "✅ Secrets (PELLA_ACCOUNTS) 已成功覆盖更新！"
            fi
          fi

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 7

      - name: 🧹 自动清理历史工作流记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3 # 保留最近 3 次运行记录，清理其余旧记录
